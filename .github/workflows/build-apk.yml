name: Build Android and iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create . --platforms=android,ios --project-name morabi_yar

      - name: Get packages
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -rf test

      - name: Analyze
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: morabi-yar-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create . --platforms=android,ios --project-name morabi_yar

      - name: Get packages
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -rf test

      - name: Analyze
        run: flutter analyze

      - name: Build iOS
        run: flutter build ios --release --no-codesign
